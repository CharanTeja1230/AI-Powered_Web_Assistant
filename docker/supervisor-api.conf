[program:lumo-api]
priority=15
command=uvicorn main:app --host 0.0.0.0 --port 8080
directory=/app
stopasgroup=true
autostart=true
autorestart=true

;Logs (all Hub activity redirected to stdout so it can be seen through "docker logs"
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0